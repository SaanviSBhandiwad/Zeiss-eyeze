# Render Blueprint. Push this folder as its own Git repo, then in Render: New > Blueprint.
# The API needs the whole repo (it imports client/src/shared), so it builds from the repo root.
services:
  - type: web
    name: eyeze-api
    runtime: node
    region: singapore          # closest Render region to India
    plan: free
    buildCommand: cd server && npm ci
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CLIENT_ORIGIN       # e.g. https://eyeze.onrender.com
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI    # https://eyeze-api.onrender.com/api/meet/oauth/callback
        sync: false
      - key: DEMO_SECRET
        generateValue: true
      # WhatsApp bot bridge (see whatsapp/README.md). The key is shared with eyeze-whatsapp automatically.
      - key: WHATSAPP_BRIDGE_KEY
        generateValue: true
      - key: WHATSAPP_BOT_URL       # https://eyeze-whatsapp.onrender.com
        sync: false
      - key: WHATSAPP_NUMBER        # number patients message, e.g. +14155238886 (Twilio sandbox)
        sync: false
      - key: WHATSAPP_JOIN_CODE     # Twilio sandbox only: the two words after "join"
        sync: false

  - type: web
    name: eyeze
    runtime: static
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL       # e.g. https://eyeze-api.onrender.com
        sync: false
    routes:
      - type: rewrite            # React Router: /optometrist etc. serve index.html
        source: /*
        destination: /index.html

  # WhatsApp bot: Twilio webhook (POST /whatsapp) + Google speech. Finished chats go to eyeze-api's queue.
  - type: web
    name: eyeze-whatsapp
    runtime: node
    region: singapore
    plan: free
    rootDir: whatsapp
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM   # whatsapp:+14155238886 for the sandbox
        sync: false
      - key: VALIDATE_TWILIO        # only accept requests signed by Twilio
        value: "true"
      - key: OPTOMETRIST_API_KEY
        generateValue: true
      - key: EYEZE_API_URL          # https://eyeze-api.onrender.com
        sync: false
      - key: WHATSAPP_BRIDGE_KEY
        fromService:
          type: web
          name: eyeze-api
          envVarKey: WHATSAPP_BRIDGE_KEY
      - key: GOOGLE_APPLICATION_CREDENTIALS   # add the key file as a Render Secret File named google-credentials.json
        value: /etc/secrets/google-credentials.json
