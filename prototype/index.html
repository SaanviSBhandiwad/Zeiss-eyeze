<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eyeze — eye care from home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Baloo+Tamma+2:wght@500;600;700&family=Mukta:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f2f6f4;--surface:#ffffff;--surface-2:#edf2ef;--ink:#13233a;--ink-2:#566373;--ink-3:#8b96a3;--line:#dce4df;
 --teal:#0f766e;--teal-h:#0b5e57;--teal-soft:#d6f1ec;
 --indigo:#4f46e5;--indigo-soft:#e4e3fc;
 --coral:#e2553f;--coral-soft:#fde3dc;
 --gold:#f59e0b;--gold-ink:#8a5300;--gold-soft:#fdf0d3;
 --sky:#0284c7;--sky-soft:#dcedfa;
 --leaf:#15803d;--leaf-soft:#daf3e1;
 --red:#c2341f;--red-soft:#fde2dc;
 --on:#ffffff;
 --shadow:0 1px 2px rgba(19,35,58,.05),0 10px 30px -14px rgba(19,35,58,.18);
 --fd:'Baloo 2','Baloo Tamma 2',system-ui,-apple-system,'Segoe UI',sans-serif;
 --fb:'Mukta','Noto Sans Kannada','Baloo Tamma 2',system-ui,-apple-system,'Segoe UI',sans-serif;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0d1714;--surface:#14211d;--surface-2:#1b2b26;--ink:#e8f0ec;--ink-2:#a5b3ad;--ink-3:#77867f;--line:#273a33;
 --teal:#2dd4bf;--teal-h:#5eead4;--teal-soft:#123a34;--indigo:#a5b4fc;--indigo-soft:#232657;--coral:#fb8a74;--coral-soft:#3d1d17;
 --gold:#fbbf24;--gold-ink:#fde68a;--gold-soft:#3a2c0b;--sky:#7dd3fc;--sky-soft:#10314a;--leaf:#4ade80;--leaf-soft:#133520;--red:#ff8a73;--red-soft:#401a13;
 --on:#0d1714;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0d1714;--surface:#14211d;--surface-2:#1b2b26;--ink:#e8f0ec;--ink-2:#a5b3ad;--ink-3:#77867f;--line:#273a33;
 --teal:#2dd4bf;--teal-h:#5eead4;--teal-soft:#123a34;--indigo:#a5b4fc;--indigo-soft:#232657;--coral:#fb8a74;--coral-soft:#3d1d17;
 --gold:#fbbf24;--gold-ink:#fde68a;--gold-soft:#3a2c0b;--sky:#7dd3fc;--sky-soft:#10314a;--leaf:#4ade80;--leaf-soft:#133520;--red:#ff8a73;--red-soft:#401a13;
 --on:#0d1714;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{height:100%;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--fd);line-height:1.15;font-weight:700}
p{margin:0}
svg{flex:none}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i.s{width:18px;height:18px}
.i.l{width:34px;height:34px;stroke-width:1.6}
.i.xl{width:44px;height:44px;stroke-width:1.5}
.muted{color:var(--ink-2)}
.small{font-size:15px}.xs{font-size:13px}
.row{display:flex;gap:12px;align-items:center}
.wr{flex-wrap:wrap}

/* header */
.hdr{flex:none;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;font-family:var(--fd);font-weight:800;font-size:22px;color:var(--teal)}
.hdr-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.lchips{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.lchips button{border:0;background:none;border-radius:999px;padding:4px 12px;font-weight:600;font-size:15px;color:var(--ink-2)}
.lchips button[aria-pressed="true"]{background:var(--surface);color:var(--teal);box-shadow:var(--shadow)}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;position:relative;color:var(--ink)}
.dot{position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--coral);border:2px solid var(--surface)}
.offpill{display:inline-flex;align-items:center;gap:6px;background:var(--coral-soft);color:var(--coral);font-weight:700;font-size:14px;padding:4px 12px;border-radius:999px}

.main{flex:1;min-height:0;overflow:auto}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 120px}
.wrap.n{max-width:760px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 24px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:17px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.p{background:var(--teal);border-color:var(--teal);color:var(--on)}
.btn.p:hover{background:var(--teal-h);border-color:var(--teal-h)}
.btn.g{background:var(--gold);border-color:var(--gold);color:#3a2400}
.btn.d{background:var(--red);border-color:var(--red);color:#fff}
.btn.o{border-color:var(--teal);color:var(--teal)}
.btn.sm{min-height:40px;padding:0 16px;font-size:15px;border-radius:12px}
.btn.big{min-height:64px;font-size:20px;padding:0 34px;border-radius:20px}
.btn.w{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{border:0;background:none;color:var(--teal);font-weight:700;padding:0;display:inline-flex;gap:6px;align-items:center}

/* mascot */
.mascot{width:var(--s,56px);height:var(--s,56px);flex:none;position:relative;display:grid;place-items:center}
.mascot svg{width:100%;height:100%}
.mascot .pup{transition:transform .25s}
.mascot.speaking .pup{animation:look 2.2s ease-in-out infinite}
.mascot.speaking::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--gold);animation:pulse 1.3s ease-out infinite}
@keyframes pulse{from{transform:scale(.92);opacity:1}to{transform:scale(1.3);opacity:0}}
@keyframes look{0%,100%{transform:translateX(0)}35%{transform:translateX(-3px)}70%{transform:translateX(3px)}}

/* home */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:24px 0 10px}
.hero h1{font-size:clamp(38px,5vw,60px);color:var(--ink);letter-spacing:-.01em;font-weight:800}
.hero h1 em{font-style:normal;color:var(--teal)}
.hero p{font-size:20px;color:var(--ink-2);margin-top:12px}
.hero .row{margin-top:26px}
.heroart{width:100%;max-width:420px;justify-self:center}
.bigcards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.bc{border:0;border-radius:26px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:200px;color:var(--ink);position:relative;overflow:hidden}
.bc .ico{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--surface)}
.bc b{font-family:var(--fd);font-size:24px;line-height:1.15}
.bc span{font-size:15px;color:var(--ink-2);margin-top:auto;display:flex;gap:6px;align-items:center}
.bc.t1{background:var(--teal);color:var(--on)}.bc.t1 span{color:var(--on);opacity:.85}.bc.t1 .ico{color:var(--teal)}
.bc.t2{background:var(--indigo-soft)}.bc.t2 .ico{color:var(--indigo)}
.bc.t3{background:var(--gold-soft)}.bc.t3 .ico{color:var(--gold-ink)}
.bc::after{content:"";position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;background:currentColor;opacity:.06}
.how{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:34px}
.how div{background:var(--surface);border-radius:20px;padding:16px;text-align:center;border:1px solid var(--line)}
.how .ico{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px}
.how b{display:block;font-family:var(--fd);font-size:17px;line-height:1.2}
.how span{font-size:13px;color:var(--ink-2)}
.c-teal{background:var(--teal-soft);color:var(--teal)}.c-indigo{background:var(--indigo-soft);color:var(--indigo)}.c-gold{background:var(--gold-soft);color:var(--gold-ink)}.c-coral{background:var(--coral-soft);color:var(--coral)}.c-sky{background:var(--sky-soft);color:var(--sky)}.c-leaf{background:var(--leaf-soft);color:var(--leaf)}
.foot{text-align:center;font-size:13px;color:var(--ink-3);margin-top:40px}
.foot button{border:0;background:none;color:var(--ink-3);text-decoration:underline;font-size:13px;padding:0}

/* cards */
.card{background:var(--surface);border-radius:26px;padding:26px;box-shadow:var(--shadow);border:1px solid var(--line)}
.h2{font-size:28px;margin-bottom:6px}
.center{text-align:center}

/* interview */
.path{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.path span{display:inline-flex;align-items:center;gap:7px;padding:6px 14px 6px 8px;border-radius:999px;font-weight:600;font-size:15px;background:var(--surface);color:var(--ink-3);border:1px solid var(--line)}
.path span i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.path span.on{border-color:transparent}
.path span.done{color:var(--leaf)}
.path span.done i{background:var(--leaf-soft)}
.prog{height:8px;border-radius:99px;background:var(--surface);overflow:hidden;margin:0 auto 22px;max-width:520px;border:1px solid var(--line)}
.prog i{display:block;height:100%;border-radius:99px;transition:width .45s ease}
.talk{display:flex;gap:14px;align-items:flex-start;margin-bottom:22px}
.bubble{background:var(--surface);border-radius:6px 26px 26px 26px;padding:16px 20px;box-shadow:var(--shadow);border:1px solid var(--line);flex:1;position:relative}
.bubble .lead{font-size:15px;color:var(--ink-2);display:flex;gap:6px;align-items:center;margin-bottom:2px}
.bubble h2{font-size:clamp(24px,3vw,32px);font-weight:700}
.bubble .spk{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:12px;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--teal)}
.bubble .ack{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--leaf);font-size:15px;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tiles.c2{grid-template-columns:repeat(2,1fr)}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:22px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-weight:600;font-size:17px;line-height:1.2;position:relative;transition:transform .12s,border-color .15s,background .15s;min-height:138px;justify-content:center}
.tile:hover{transform:translateY(-2px);border-color:var(--ink-3)}
.tile .blob{width:72px;height:72px;border-radius:24px;display:grid;place-items:center}
.tile .blob .i{width:38px;height:38px;stroke-width:1.6}
.tile[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);transform:scale(1.02)}
.tile .tick{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--teal);color:var(--on);display:none;place-items:center}
.tile[aria-pressed="true"] .tick{display:grid;animation:pop .25s ease-out}
.tile .tick .i{width:16px;height:16px;stroke-width:3}
.qfoot{display:flex;align-items:center;gap:14px;margin-top:22px;justify-content:space-between}
.mic{width:72px;height:72px;border-radius:50%;border:0;background:var(--gold);color:#3a2400;display:grid;place-items:center;flex:none;position:relative;box-shadow:0 8px 20px -8px rgba(245,158,11,.7)}
.mic .i{width:32px;height:32px}
.mic.on{background:var(--coral);color:#fff}
.mic.on::before,.mic.on::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--coral);animation:pulse 1.2s ease-out infinite}
.mic.on::after{animation-delay:.6s}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--ink-2);font-weight:600}
.heard{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;font-size:16px}
.heard span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.wave{display:inline-flex;gap:4px;align-items:center;height:26px}
.wave i{width:5px;border-radius:3px;background:var(--coral);animation:wave 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}
@keyframes wave{0%,100%{height:6px}50%{height:24px}}
/* slider activity */
.dial2{background:var(--surface);border-radius:26px;padding:24px;border:1px solid var(--line);text-align:center}
.bignum{font-family:var(--fd);font-size:84px;font-weight:800;line-height:1;color:var(--teal)}
.bignum small{font-size:24px;font-weight:600;color:var(--ink-2);margin-left:6px}
.suns{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin:18px auto 6px;max-width:520px}
.suns i{height:34px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;transition:background .2s}
.suns i.on{background:var(--gold)}
.suns i.on.ph{background:var(--sky)}
.suns i svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
.dlbl{display:flex;justify-content:space-between;max-width:520px;margin:0 auto;font-size:13px;color:var(--ink-3)}
input[type=range]{width:100%;max-width:520px;accent-color:var(--teal);height:34px}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:6px 0}
.stepper button{width:64px;height:64px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:30px;font-weight:700;color:var(--teal);display:grid;place-items:center}
.chipsrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.chipsrow button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-weight:600}
/* scene activity */
.scene{display:grid;grid-template-columns:70px repeat(3,1fr);gap:10px;align-items:stretch}
.scene .me{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-2);font-size:13px;font-weight:600}
.zcol{border-radius:22px;padding:12px 10px;display:flex;flex-direction:column;gap:10px}
.zcol h3{font-size:17px;text-align:center}
.zcol .dst{font-size:12px;text-align:center;color:var(--ink-2);margin-top:-8px}
.zcol.near{background:var(--indigo-soft)}.zcol.mid{background:var(--teal-soft)}.zcol.far{background:var(--gold-soft)}
.sitem{border:2px solid transparent;background:var(--surface);border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:15px;position:relative}
.sitem .i{width:40px;height:40px;stroke-width:1.5;transition:filter .3s}
.sitem[aria-pressed="true"]{border-color:var(--coral)}
.sitem[aria-pressed="true"] .i{filter:blur(2.2px)}
.sitem .bl{position:absolute;top:-8px;right:-4px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;display:none}
.sitem[aria-pressed="true"] .bl{display:block}

/* tests */
.tsteps{display:flex;gap:6px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.tsteps span{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-3)}
.tsteps span.cur{background:var(--teal);color:var(--on);border-color:var(--teal)}
.tsteps span.done{background:var(--leaf-soft);color:var(--leaf);border-color:transparent}
.tsteps .i{width:20px;height:20px}
.tgrid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1fr);gap:24px;align-items:start}
.tinfo h2{font-size:30px;margin:10px 0 6px}
.instr{display:flex;gap:12px;align-items:center;margin-top:14px;padding:14px 16px;border-radius:18px;background:var(--gold-soft);font-weight:600;font-size:18px;line-height:1.3}
.instr .i{color:var(--gold-ink);width:30px;height:30px}
.ok{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--leaf);background:var(--leaf-soft);padding:4px 12px;border-radius:999px;margin-top:12px}
.tcard{background:#ffffff;color:#000;border-radius:20px;border:1px solid #e3e8e5;min-height:260px;display:grid;place-items:center;position:relative;padding:18px;overflow:hidden}
.tcard .lv{position:absolute;top:10px;right:14px;font-size:13px;font-weight:700;color:#6b7680}
.tq{text-align:center;font-weight:700;font-size:19px;margin:16px 0 4px;font-family:var(--fd)}
.pad{display:grid;grid-template-columns:repeat(3,70px);grid-template-rows:repeat(3,62px);gap:8px;justify-content:center;margin-top:10px}
.pad button{border:2px solid var(--line);background:var(--surface);border-radius:18px;display:grid;place-items:center;color:var(--ink)}
.pad button:hover{border-color:var(--teal);color:var(--teal)}
.pad .mic{width:62px;height:62px;justify-self:center;border:0;color:#3a2400}
.pad .c{visibility:hidden}
.readtxt{font-family:Georgia,'Noto Serif','Noto Sans Kannada',serif;color:#000;text-align:center;line-height:1.35}
.gauge{text-align:center}.gauge .k{font-size:13px;color:#6b7680}
.gauge b{display:block;font-family:var(--fd);font-size:60px;font-weight:800;color:#0f766e;line-height:1.1}
.gauge .trk{width:240px;height:8px;border-radius:4px;background:#e7ece9;margin:10px auto;position:relative;overflow:hidden}
.gauge .trk i{position:absolute;left:0;top:0;bottom:0;background:#0f766e}
.plate{width:240px;height:240px;border-radius:50%;display:block}
.cnums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.cnums button{height:64px;border:2px solid var(--line);border-radius:18px;background:var(--surface);font-family:var(--fd);font-size:30px;font-weight:700}
.amsler{width:100%;max-width:300px;aspect-ratio:1;display:grid;grid-template-columns:repeat(14,1fr);border:2px solid #000;position:relative;background:#fff}
.amsler button{border:0;border-right:1px solid #000;border-bottom:1px solid #000;background:#fff;padding:0;min-width:0}
.amsler button[aria-pressed="true"]{background:#fcd34d}
.amsler::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#000;pointer-events:none}
.dial g{cursor:pointer}.dial line.v{stroke:#000}.dial g:hover line.v{stroke:#0f766e}
.dial text{font:700 13px Mukta,system-ui,sans-serif;fill:#3a4252}
.cam{position:relative;width:100%;aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:#0a1712}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none}
.cam.live video{display:block}.cam.live .mesh rect{display:none}.cam.live .mesh{opacity:.6}
.mesh{position:absolute;inset:0;width:100%;height:100%}
.cam .tg{position:absolute;top:10px;left:10px;font-size:12px;font-weight:700;color:#fff;background:rgba(5,15,12,.7);padding:3px 10px;border-radius:999px;display:flex;gap:6px;align-items:center}
.cam .tg::before{content:"";width:7px;height:7px;border-radius:50%;background:#4ade80}
.cam .ov{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.cam .ov span{background:rgba(5,15,12,.75);color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:10px}
.scan{position:absolute;left:0;right:0;height:3px;background:#fbbf24;box-shadow:0 0 14px #fbbf24;animation:scan 1.6s linear infinite}
@keyframes scan{from{top:6%}to{top:94%}}
.cardbox{height:150px;border-radius:12px;border:2.5px dashed #0f766e;background:linear-gradient(135deg,#e3f6f2,#c8ebe4);position:relative;margin:0 auto}

/* report */
.rep-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}

.rt{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;text-align:center;position:relative}
.rt .i{width:30px;height:30px;color:var(--ink-2)}

.rt::after{content:"";position:absolute;top:10px;right:10px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.rt.good::after{background:var(--leaf)}.rt.warn::after{background:var(--gold)}
.rt.warn{background:var(--gold-soft);border-color:transparent}

.phonef{display:flex;gap:8px}.phonef span{display:grid;place-items:center;padding:0 14px;border-radius:16px;background:var(--surface-2);font-weight:700;border:1.5px solid var(--line)}

/* demo dock */
.dock{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;width:310px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 40px -16px rgba(0,0,0,.35);font-size:14px}

.dlog{list-style:none;margin:8px 0 0;padding:8px 0 0;border-top:1px solid var(--line);max-height:190px;overflow:auto}

d_contrast:['Checks how well you see faint shapes. This can drop early with cataract.','हल्की आकृतियाँ आप कितनी अच्छी तरह देखते हैं, यह जाँचता है। मोतियाबिंद में यह पहले कम होता है।','ಮಸುಕಾದ ಆಕಾರಗಳನ್ನು ಎಷ್ಟು ಚೆನ್ನಾಗಿ ನೋಡುತ್ತೀರಿ ಎಂದು ಪರೀಕ್ಷಿಸುತ್ತದೆ. ಕಣ್ಣಿನ ಪೊರೆಯಲ್ಲಿ ಇದು ಬೇಗ ಕಡಿಮೆಯಾಗುತ್ತದೆ.'],
d_color:['Screens for red-green colour vision differences.','लाल-हरे रंग पहचानने में अंतर की जाँच करता है।','ಕೆಂಪು-ಹಸಿರು ಬಣ್ಣ ಗುರುತಿಸುವಿಕೆಯ ವ್ಯತ್ಯಾಸವನ್ನು ಪರೀಕ್ಷಿಸುತ್ತದೆ.'],
d_amsler:['Checks the centre of your vision for wavy or missing areas. Important with diabetes or after 50.','नज़र के बीच के हिस्से में टेढ़ी या गायब जगह की जाँच करता है। मधुमेह या 50 के बाद ज़रूरी।','ದೃಷ್ಟಿಯ ಮಧ್ಯಭಾಗದಲ್ಲಿ ವಕ್ರ ಅಥವಾ ಕಾಣೆಯಾದ ಭಾಗಗಳನ್ನು ಪರೀಕ್ಷಿಸುತ್ತದೆ. ಮಧುಮೇಹ ಅಥವಾ 50 ನಂತರ ಮುಖ್ಯ.'],
d_astig:['Screens for astigmatism, where lines in some directions look sharper than others.','एस्टिग्मैटिज़्म की जाँच, जिसमें कुछ दिशाओं की लाइनें बाकी से ज़्यादा साफ़ दिखती हैं।','ಕೆಲವು ದಿಕ್ಕಿನ ಗೆರೆಗಳು ಇತರಕ್ಕಿಂತ ಸ್ಪಷ್ಟವಾಗಿ ಕಾಣುವ ಅಸ್ಟಿಗ್ಮ್ಯಾಟಿಸಮ್ ಪರೀಕ್ಷೆ.'],

function computeResult(r){
 const a=r.answers||{},te=r.tests||{},age=+a.age||+r.age||0;
 const hasProfile=a.work!==undefined;
 const z=zonesOf(a);
 let dom=null,dominant=null;
 if(hasProfile){
  const nearEst={craft:4,student:4,office:2,shop:2,home:2}[a.work]||0.5;
  const nw=a.nearwork!==undefined?+a.nearwork:nearEst,ph=+a.phone||0,od=+a.outdoor||0;
  let near=nw+ph*0.7,mid=ph*0.3+0.4,far=od;
  const occ={farming:[0,0.5,2.5],labour:[0,0.5,2],shop:[0.5,2.5,0.5],office:[0.5,3,0],student:[1.5,1,0.5],home:[0.5,2.5,0.5],craft:[2,1,0],driver:[0,0.5,4]}[a.work]||[0,0,0];
  near+=occ[0];mid+=occ[1];far+=occ[2];
  if(a.drive&&a.drive!=='no')far+=a.drive==='four'?2:1;
  const tot=near+mid+far||1;
  dom={near:Math.round(near/tot*100),mid:Math.round(mid/tot*100)};dom.far=100-dom.near-dom.mid;
  dominant=Object.entries(dom).sort((x,y)=>y[1]-x[1])[0][0];
 }
 const reasons=[],flags=[];let tri='green';
 const amber=s=>{if(tri!=='red')tri='amber';reasons.push(s)};
 const red=s=>{tri='red';reasons.unshift(s)};
 const rfLbl=v=>optLabel({o:RF},v,'en').toLowerCase();
 const rf=[...(a.cc_sudden||[]),...(a.redflag||[])].filter(x=>x!=='none');
 if(rf.length)red('Red-flag symptom: '+[...new Set(rf)].map(rfLbl).join(', '));
 if(a.cc_irrit==='pain')red('Red eye with pain — rule out acute glaucoma, uveitis or keratitis');
 if(te.va&&te.va.R<0&&te.va.L<0)red('Very low vision in both eyes (worse than 6/60)');
 if(a.cc_irrit==='discharge')amber('Red eye with discharge — likely infection, see within 2 days');
 if(a.cc_since==='weeks'&&['far','near'].includes(a.cc))amber('Vision changed within the last few weeks');
 if(a.cc_eye==='right'||a.cc_eye==='left')amber('Blur in one eye only ('+a.cc_eye+')');
 if(has(a.medical,'diabetes')){
  amber('Diabetes'+(a.diab_years==='gt10'?' for over 10 years':a.diab_years==='5to10'?' for 5–10 years':'')+(a.diab_check==='never'?', never had an eye exam':a.diab_check==='gt1'?', no eye exam in over a year':'')+' — needs dilated retinal exam');
  if(a.diab_spots==='yes'||a.diab_spots==='some')amber('Diabetic with spots or patches ('+(a.diab_spots==='yes'?'often':'sometimes')+')');
 }
 if(has(a.family,'glaucoma')||has(a.family,'blind'))amber('Family history of '+(a.family||[]).filter(x=>x==='glaucoma'||x==='blind').map(x=>x==='blind'?'blindness':'glaucoma').join(' and ')+' — check eye pressure');
 if(a.meds==='yes')amber('Regular steroid use — risk of cataract and raised eye pressure');
 if(a.surgery==='injury')amber('Previous eye injury');
 if(age>=60)amber('Age 60+ — screen for cataract and glaucoma');
 if(te.amsler&&(te.amsler.R>0||te.amsler.L>0))amber('Amsler grid distortion marked (R '+te.amsler.R+', L '+te.amsler.L+')');
 if(te.color&&te.color.c<te.color.n)amber('Colour plates: '+te.color.c+' of '+te.color.n+' correct');
 if(te.contrast&&te.contrast.pct>=25)amber('Reduced contrast sensitivity ('+te.contrast.pct+'%), possible early cataract');
 if(te.va&&(te.va.R<3||te.va.L<3)&&!(te.va.R<0&&te.va.L<0))amber('Distance acuity worse than 6/18 in at least one eye');
 const nearIssue=z.includes('near')||a.cc==='near'||a.presby==='yes'||(te.np&&te.np.add>=0.75)||(te.near&&te.near.level!==undefined&&te.near.level<5);
 const farIssue=z.includes('far')||a.cc==='far'||(te.va&&(te.va.R<5||te.va.L<5));
 const midIssue=z.includes('mid')||a.switching==='yes';
 if(a.presby==='yes'||(age>=40&&te.np&&te.np.add>=0.75))flags.push('Presbyopia likely'+(te.np?' (blur at '+te.np.cm+' cm, add ≈ +'+te.np.add.toFixed(2)+')':''));
 if(a.glasses_src==='market')flags.push('Using readymade glasses from the market');
 if(a.glasses_src==='other')flags.push('Using someone else’s glasses');
 if(a.glasses_age==='gt2')flags.push('Current glasses over 2 years old');
 if(a.night==='glare')flags.push('Night glare while driving');
 if(a.dust==='yes')flags.push('Dust or smoke exposure at work');
 if(a.surgery==='cataract')flags.push('Previous cataract surgery');
 if(te.astig&&te.astig.res==='possible')flags.push('Possible astigmatism, axis ≈ '+te.astig.axis+'°');
 let lens,why=[];
 if(tri==='red'){lens='defer';why.push('Red flag — refer before refraction')}
 else if(age>=40&&nearIssue&&(farIssue||midIssue)){
  const pr=a.priority==='one'||dominant==='mid'||a.work==='office';
  lens=pr?'progressive':'bifocal';
  why.push('Age '+age+' with near difficulty'+(te.np?' (add ≈ +'+te.np.add.toFixed(2)+')':''));
  why.push(farIssue?'Distance also affected'+(te.va?' (R '+vaStr(te.va.R)+', L '+vaStr(te.va.L)+')':''):'Intermediate difficulty or slow focus switching');
  why.push(pr?'Wants one pair / intermediate-heavy work → progressive':'Cost priority or outdoor distance-dominant work → bifocal');
 }
 else if(age>=40&&nearIssue){lens='sv_read';why.push('Near difficulty only, distance acceptable')}
 else if(farIssue){lens='sv_dist';why.push('Distance difficulty'+(te.va?' (R '+vaStr(te.va.R)+', L '+vaStr(te.va.L)+')':''))}
 else if(nearIssue||midIssue||a.cc==='strain'){lens='defer';why.push('Near or strain complaints — check for hyperopia or binocular issues in person')}
 else{lens='none';why.push('No reported difficulty and screening within normal limits')}
 const coat=[];
 if(+a.outdoor>=3||a.priority==='sun'||has(a.strain_when,'sun'))coat.push('uv');
 if(a.night==='glare')coat.push('ar');
 if(+a.phone>=4)coat.push('blue');
 if(a.priority==='strong'||a.dust==='yes'||['farming','driver','craft','labour'].includes(a.work))coat.push('tough');
 const next=tri==='red'?'hospital':tri==='amber'?'camp':(lens==='defer'?'video':'store');
 const centre=next==='hospital'?'dist':next==='camp'?'camp':next==='video'?'video':'netra';
 const tips=[];
 if(has(a.medical,'diabetes'))tips.push('diab');
 if(has(a.family,'glaucoma'))tips.push('family');
 if(a.glasses_src==='market'||a.glasses_src==='other')tips.push('ready');
 if(a.dust==='yes')tips.push('dust');
 if(a.night==='glare')tips.push('night');
 if(+a.outdoor>=3)tips.push('sun');
 if(nearIssue)tips.push('light');
 if(+a.phone>=3||+a.nearwork>=3)tips.push('r2020');
 if(a.cc==='strain'||a.cc==='irrit')tips.push('blink');
 tips.push('rub');
 return{dom,dominant,tri,reasons,flags,lens,why,coat,next,centre,tips:[...new Set(tips)].slice(0,6)};
}

 add('color',te.color?te.color.c+' / '+te.color.n:'',te.color?te.color.c===te.color.n:null,68);
 add('amsler',te.amsler?(te.amsler.R+te.amsler.L===0?(L==='en'?'No distortion':'—'):'R '+te.amsler.R+'  ·  L '+te.amsler.L):'',te.amsler?te.amsler.R+te.amsler.L===0:null,77);
 add('astig',te.astig?(te.astig.res==='none'?(L==='en'?'Not indicated':'—'):'Axis ≈ '+te.astig.axis+'°'):'',te.astig?te.astig.res==='none':null,60);
 add('pd',te.pd?te.pd.pd.toFixed(1)+' mm':'',te.pd?true:null,te.pd?te.pd.conf:0);

}

function ago(ts){const m=Math.max(0,Math.round((Date.now()-ts)/60000));if(m<1)return'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+' h ago';return Math.round(h/24)+' d ago'}
const LOC={en:'en-IN',hi:'hi-IN',kn:'kn-IN'};
function fmtDate(ts,lang){return new Date(ts||Date.now()).toLocaleDateString(LOC[lang||S.lang],{day:'numeric',month:'long',year:'numeric'})}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){VOICES=[]}}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
function setSpeaking(on){S.speaking=on;document.querySelectorAll('[data-mark]').forEach(e=>e.classList.toggle('speaking',on))}
function speak(text,lang){
 lang=lang||S.lang;if(!S.voiceOn||!('speechSynthesis' in window)||!text)return;
 try{speechSynthesis.cancel()}catch(e){}
 const code=LANGS[lang].tts,v=VOICES.find(v=>v.lang===code)||VOICES.find(v=>(v.lang||'').toLowerCase().replace('_','-').startsWith(lang));
 if(!v&&lang!=='en'){if(!S.warned[lang]){S.warned[lang]=1;toast(t('noVoice',{lang:LANGS[lang].name}));log('No '+LANGS[lang].name+' voice installed on this device; production build streams Bhashini / IndicTTS audio','voice')}return}
 const u=new SpeechSynthesisUtterance(text);if(v)u.voice=v;u.lang=code;u.rate=.95;
 let done=false;const fin=()=>{if(done)return;done=true;setSpeaking(false)};
 u.onend=fin;u.onerror=fin;setTimeout(fin,Math.min(20000,2000+text.length*85));setSpeaking(true);try{speechSynthesis.speak(u)}catch(e){fin()}
}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}setSpeaking(false)}
function norm(s){return String(s).toLowerCase().replace(/[.,!?;:()“”"'’।]/g,' ').replace(/\s+/g,' ').trim()}
function matchOpts(alts,opts){const out=[];for(const o of opts){const cands=[...o.l,...(o.kw||[])].map(norm);
 const hit=alts.some(al=>{const A=norm(al);if(!A)return false;const aw=A.split(' ');return cands.some(c=>{if(!c)return false;if(c.length>=2&&(' '+A+' ').includes(' '+c+' '))return true;if(A.length>=3&&c.includes(A))return true;return c.split(' ').some(cw=>cw.length>=4&&aw.some(w=>w.length>=4&&(cw.startsWith(w)||w.startsWith(cw))))})});
 if(hit)out.push(o.v)}return out}
const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,ek:1,do:2,teen:3,char:4,chaar:4,paanch:5,chhe:6,saat:7,aath:8,nau:9,das:10,'एक':1,'दो':2,'तीन':3,'चार':4,'पांच':5,'पाँच':5,'छह':6,'सात':7,'आठ':8,'नौ':9,'दस':10,'ಒಂದು':1,'ಎರಡು':2,'ಮೂರು':3,'ನಾಲ್ಕು':4,'ಐದು':5,'ಆರು':6,'ಏಳು':7,'ಎಂಟು':8,'ಒಂಬತ್ತು':9,'ಹತ್ತು':10};
function parseNum(alts){for(const a of alts){const m=String(a).match(/\d+/);if(m)return+m[0];for(const w of norm(a).split(' '))if(NUMW[w]!==undefined)return NUMW[w]}return null}
function recognize(cb){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return false;
 try{const r=new SR();r.lang=LANGS[S.lang].tts;r.interimResults=false;r.maxAlternatives=4;let done=false;const fin=x=>{if(done)return;done=true;cb(x)};
  r.onresult=e=>{const alts=[];for(let i=0;i<e.results[0].length;i++)alts.push(e.results[0][i].transcript);fin(alts)};r.onerror=()=>fin(null);r.onend=()=>fin(null);r.start();return true}catch(e){return false}}

function go(screen){S.p.screen=screen;S.p.heard=null;S.p.pick=null;render();const m=document.getElementById('main');if(m)m.scrollTop=0}

function afterConsent(){const m=S.p.mode;if(m==='precheck')return go('testsIntro');if(nextQ())go('interview');else if(m==='full')go('testsIntro');else finalize()}
function nextQ(){return visibleQs(S.p.answers).find(q=>S.p.answers[q.id]===undefined)}
function prune(){const vis=new Set(visibleQs(S.p.answers).map(q=>q.id));for(const k of Object.keys(S.p.answers))if(!vis.has(k))delete S.p.answers[k];S.p.qhist=S.p.qhist.filter(k=>vis.has(k));
 for(const q of Q)if(q.cond&&vis.has(q.id)&&!S.p.fired[q.id]){S.p.fired[q.id]=1;log('Follow-up added: '+q.rule,'rule')}}
function initVal(q){if(q.type==='age')return 40;if(q.type==='hours')return q.id==='outdoor'?3:2;return null}
function setAnswer(id,val){
 if(S.p.answers[id]!==undefined)return;
 S.p.answers[id]=val;S.p.qhist.push(id);S.p.multiSel=null;S.p.pick=null;S.p.val=null;S.p.ackAt=Date.now();
 log(QMAP[id].t[0]+' → '+ansLabel(QMAP[id],val,'en')+(S.p.voiceAns[id]?' (voice)':''),S.p.voiceAns[id]?'voice':'');
 prune();
 const rfv=id==='cc_sudden'||id==='redflag'?(val||[]).filter(v=>v!=='none'):[];
 if(rfv.length||(id==='cc_irrit'&&val==='pain')){S.p.modal='urgent';log('Red flag: urgent-care advice shown now, profile marked URGENT','alert');speak(t('urgentTitle')+'. '+t('urgentBody'))}
 const n=nextQ();
 if(!n){log('Interview complete: '+S.p.qhist.length+' of '+Q.length+' possible questions asked');if(S.p.modal){render();return}finishInterview();return}
 S.p.val=initVal(n);render();
}
function finishInterview(){if(S.p.mode==='full'){speak(t('profileDone'));go('testsIntro')}else finalize()}
function finalize(){S.p.result=computeResult(curRecord());if(!S.p.pid)S.p.pid=newPid();const r=S.p.result;log('Report '+S.p.pid+': '+(r.dominant?ZN[r.dominant].toLowerCase()+'-dominant, ':'')+'triage '+TRI_EN[r.tri].toUpperCase(),r.tri==='red'?'alert':'rule');go('result')}

 case'va':return{eye:'R',level:0,trial:0,dir:randDir(),best:-1};
 case'contrast':return{level:0,trial:0,dir:randDir(),best:-1};
 case'near':return{level:0};case'np':return{phase:'ready',cm:60};case'color':return{i:0,c:0};
 case'amsler':return{eye:'R',marks:[],R:0};case'astig':return{};case'pd':return{phase:'ready'}}}

/* listening */
function startListen(){
 const q=nextQ();if(!q||S.p.listening)return;stopSpeak();S.p.listening=true;S.p.heard=null;render();
 if(S.autopilot){setTimeout(()=>{if(!S.p.listening)return;S.p.listening=false;applyVoice(q,PERSONA.answers[q.id])},1400*S.speed);return}
 const ok=recognize(alts=>{if(!S.p.listening)return;S.p.listening=false;if(!alts){toast(t('notUnderstood'));render();return}
  log('Speech recognised: “'+alts[0]+'”','voice');
  if(q.type==='hours'||q.type==='age'){const n=parseNum(alts);if(n===null){toast(t('notUnderstood'));render();return}return applyVoice(q,Math.max(q.type==='age'?5:0,Math.min(q.type==='age'?95:12,n)),alts[0])}
  const opts=q.type==='scene'?SCENE:q.o;let vals=matchOpts(alts,opts);

  if(!vals.length){toast(t('notUnderstood'));render();return}

 MESH=`<svg class="mesh" viewBox="0 0 400 300" aria-hidden="true"><defs><radialGradient id="mg" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#123b34"/><stop offset="1" stop-color="#07130f"/></radialGradient></defs><rect width="400" height="300" fill="url(#mg)"/><g fill="#5eead4">${d}${e}</g><line x1="167" y1="134" x2="233" y2="134" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3 3"/><ellipse cx="200" cy="150" rx="80" ry="106" fill="none" stroke="#5eead4" stroke-opacity=".35"/></svg>`;return MESH}

 <label class="fld"><span>Guest email (health worker or patient, optional)</span><input id="m_email" type="email" placeholder="kavya.asha@example.com" value="${esc(m.email)}"></label>
 <div class="meetbox"><b>How it works</b><ol><li>Create the invite. Google Calendar opens with the patient’s details filled in.</li><li>Click “Add Google Meet video conferencing”, then Save.</li><li>Paste the Meet link below and send it to the patient.</li></ol></div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><a class="btn p" id="gcal" href="${esc(gcalURL(m,r))}" target="_blank" rel="noopener" data-act="gcalOpened">${ic('calendar','s')} Create Google Meet invite</a><a class="btn" href="https://meet.google.com/new" target="_blank" rel="noopener">${ic('ext','s')} Instant meeting</a></div>
 <label class="fld" style="margin-top:14px"><span>Google Meet link</span><input id="m_link" type="url" placeholder="https://meet.google.com/abc-defg-hij" value="${esc(m.link)}"></label>
 <div class="row"><button class="btn" style="flex:1" data-act="meetClose">Cancel</button><button class="btn p" style="flex:1" data-act="meetSend">${ic('send','s')} Send invite to patient</button></div>
 <p class="xs muted" style="margin-top:10px">The patient gets the time and link in the app and by SMS. Audio-first is recommended for low bandwidth.</p></div></div>`}
function readMeet(){const g=id=>{const e=document.getElementById(id);return e?e.value.trim():''};const m=S.d.meet;if(!m)return;m.date=g('m_date')||m.date;m.time=g('m_time')||m.time;m.dur=+g('m_dur')||m.dur;m.email=g('m_email');m.link=g('m_link')}

function sendInvite(){readMeet();const m=S.d.meet,r=findRec(m.id);if(!r)return;
 if(m.link&&!/^https:\/\/meet\.google\.com\/[a-z0-9-]+/i.test(m.link)){toast('Please paste a Google Meet link, like https://meet.google.com/abc-defg-hij');return}
 const when=new Date(m.date+'T'+m.time).getTime();
 updateRec(r.id,x=>{x.invite={when,dur:m.dur,link:m.link||'',email:m.email||'',at:Date.now()};if(x.status==='new')x.status='review'});
 log('Video consultation sent to '+r.name+' for '+fmtWhen(when,'en')+(m.link?' with Meet link':' (link to follow)'),'net');toast('Video consultation invite sent to '+r.name);S.d.meet=null;lastSig='';render()}
function analyticsHTML(){
 const all=allPatients().map(r=>({r,res:computeResult(r)}));const tri={green:28,amber:11,red:3},dom={near:15,mid:12,far:19},lng={kn:31,hi:9,en:6};
 all.forEach(({r,res})=>{tri[res.tri]++;if(res.dominant)dom[res.dominant]++;lng[r.lang]++});
 const col={green:'var(--leaf)',amber:'var(--gold)',red:'var(--red)'};
 const bars=(o,lab,c)=>{const tot=Object.values(o).reduce((a,b)=>a+b,0);return`<div class="hb">${Object.entries(o).map(([k,v])=>`<div class="r"><span>${lab(k)}</span><div class="tr"><i style="width:${Math.round(v/tot*100)}%;background:${c?c(k):'var(--teal)'}"></i></div><b>${v}</b></div>`).join('')}</div>`};
 const total=Object.values(tri).reduce((a,b)=>a+b,0);
 return`<h1>Analytics</h1><p class="muted">Last 30 days · anonymised</p><div class="stats"><div class="stat"><b>${total}</b><span>Profiles received</span></div><div class="stat"><b>12</b><span>Villages reached</span></div><div class="stat r"><b>${tri.red}</b><span>Urgent referrals</span></div><div class="stat g"><b>71%</b><span>Answers by voice</span></div></div>
 <div class="d3" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px"><div class="box"><h3>Triage</h3>${bars(tri,k=>TRI_EN[k],k=>col[k])}</div><div class="box"><h3>Vision dominance</h3>${bars(dom,k=>ZN[k])}</div><div class="box"><h3>Language</h3>${bars(lng,k=>LANGS[k].name)}</div></div>
 <div class="box"><h3>Most common findings</h3>${bars({'Presbyopia':22,'Reduced distance acuity':17,'Readymade glasses in use':14,'Diabetes without eye exam':9,'Night glare':8},k=>k)}</div>`}
function centresHTML(){const tl={store:'Optical store',camp:'Eye camp',hospital:'Hospital',video:'Teleconsultation'};
 return`<h1>Referral centres</h1><p class="muted" style="margin-bottom:16px">Where patients go for final refraction, fitting or urgent care.</p><div class="tw"><table><thead><tr><th>Centre</th><th>Type</th><th>Distance</th><th>Details</th><th>This week</th></tr></thead><tbody>${CENTRES.map(c=>`<tr><td><b>${c.name}</b></td><td>${tl[c.type]}</td><td>${c.km?c.km+' km':'Remote'}</td><td>${c.detail}</td><td>${c.load}</td></tr>`).join('')}</tbody></table></div>`}
function dDock(){const tg=(act,on,lab,sub)=>`<button class="tog" data-act="${act}" aria-pressed="${on}"><span>${lab}<small>${sub}</small></span><i></i></button>`;
 return`<div class="dock ${S.dockOpen?'':'min'}"><button class="dh" data-act="dock"><span class="lv ${S.docAuto?'on':''}"></span>Demo controls</button>${S.dockOpen?`<div class="db">${tg('docAuto',S.docAuto,'Auto-review','Opens new profiles, replies and books a video call')}${tg('portal',true,'Optometrist portal','Switch off to return to the patient app')}<div class="row" style="justify-content:space-between;margin-top:8px"><span class="xs muted">Engine log</span><button class="lnk xs" data-act="reset">Reset demo</button></div><ol class="dlog" id="dlog">${logItems()}</ol></div>`:''}</div>`}

/* ============ render loop ============ */
function render(){
 S.tok++;const m0=document.getElementById('main'),sc=m0?m0.scrollTop:0;
 let h;
 if(S.page==='portal'){h=`<main class="main" id="main">${portalHTML()}</main>`+(S.d.logged?dDock():'')+(S.d.meet?meetModal():'')}
 else{const p=S.p;let inner;
  switch(p.screen){case'consent':inner=`<div class="wrap n">${consentHTML()}</div>`;break;case'interview':inner=`<div class="wrap n">${interviewHTML()}</div>`;break;
   case'testsIntro':inner=`<div class="wrap n"><div class="card center">${mascot(90)}<h2 class="h2" style="margin-top:12px">${p.mode==='full'?t('testsIntro'):t('card3')}</h2><p class="muted">${t('testsSub')}</p><ul class="tlist">${TESTS.map((k,i)=>`<li><button class="${p.tests[k]?'done':''}" data-act="openTest" data-v="${k}"><span class="blob c-${PAL[i%PAL.length]}">${ic(p.tests[k]?'check':TEST_IC[k])}</span>${t('s_'+k)}</button></li>`).join('')}</ul><div style="margin-top:20px"><button class="btn p big" data-act="startTests">${Object.keys(p.tests).length?t('resumeTests'):t('startTests')} ${ic('fwd')}</button></div></div></div>`;break;
   case'test':inner=`<div class="wrap">${testHTML()}</div>`;break;
   case'testsDone':inner=`<div class="wrap n"><div class="card center" style="padding:44px 24px">${mascot(110)}<h2 class="h2" style="margin-top:14px">${t('testsDone')}</h2><p class="muted">${t('testsDoneSub')}</p><div style="margin-top:22px"><button class="btn p big" data-act="finalize">${t('seeProfile')} ${ic('fwd')}</button></div></div></div>`;break;
   case'result':inner=`<div class="wrap">${resultHTML()}</div>`;break;case'messages':inner=`<div class="wrap n">${messagesHTML()}</div>`;break;
   default:inner=`<div class="wrap">${homeHTML()}</div>`}
  h=pHeader()+`<main class="main" id="main">${inner}</main>`+pDock()+(p.modal==='urgent'?urgentModal():p.modal==='login'?loginModal():'')}
 document.getElementById('app').innerHTML=h;
 const m1=document.getElementById('main');if(m1)m1.scrollTop=sc;
 afterRender()}
function afterRender(){
 if(S.page==='patient'){ensureCamera();if(S.p.screen==='test'&&S.p.cur==='color')drawPlate();speakForScreen()}
 else{if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}const ds=document.getElementById('dsearch');if(ds&&S.d.q){const q=S.d.q.toLowerCase();document.querySelectorAll('tr.rw').forEach(r=>{r.style.display=r.dataset.s.includes(q)?'':'none'})}}
 scheduleAuto()}
function speakKey(){const p=S.p;if(p.modal)return null;
 switch(p.screen){
  case'consent':return['consent',t('consentSay')];
  case'interview':{const q=nextQ();if(!q)return null;const last=p.qhist[p.qhist.length-1];let lead='';if(last&&QMAP[last].sec!==q.sec)lead=t('secIn_'+q.sec)+' ';else if(q.lead)lead=tx(q.lead)+' ';return['q:'+q.id+':'+p.qhist.length,lead+tx(q.t)]}
  case'testsIntro':return['ti',t('testsIntro')+'. '+t('testsSub')];
  case'test':{const s=p.ts,id=p.cur;
   if(id==='va')return['va'+s.eye,(s.eye==='R'?t('coverLeft'):t('coverRight'))+'. '+t('whereGap')];
   if(id==='setup')return['setup'+s.phase,s.phase==='card'?t('calibTitle'):t('distTitle')];
   if(id==='near')return['near',t('nearTitle')+'. '+t('canRead')];if(id==='np')return['np',t('npTitle')+'. '+t('npBody')];
   if(id==='contrast')return['ct',t('contrastQ')];if(id==='color')return['col',t('colorQ')];
   if(id==='amsler')return['am'+s.eye,(s.eye==='R'?t('coverLeft'):t('coverRight'))+'. '+t('amslerQ')];
   if(id==='astig')return['as',t('astigQ')];if(id==='pd')return['pd',t('pdTitle')];return null}
  case'testsDone':return['td',t('testsDone')];
  case'result':{const r=p.result;if(!r||p.status)return null;return['res',(r.dominant?t('mostly',{z:t('za_'+r.dominant)})+' ':'')+t('triD_'+r.tri)]}}
 return null}
function speakForScreen(){const k=speakKey();if(!k||!k[1])return;if(S._spoken===k[0]+S.lang)return;S._spoken=k[0]+S.lang;speak(k[1])}

/* ============ guided demos ============ */
function scheduleAuto(){
 const tok=S.tok,go2=(ms,fn)=>setTimeout(()=>{if(tok===S.tok)fn()},ms*S.speed);
 if(S.page==='portal'){if(!S.docAuto)return;const G=(ms,fn)=>go2(ms,()=>{if(S.docAuto)fn()});
  if(!S.d.logged)return G(1200,()=>{S.d.logged=true;log('Optometrist signed in');render()});
  if(S.d.meet){const m=S.d.meet;if(!m._auto){m._auto=1;G(3500,()=>{m.link='';sendInvite();S.docAuto=false;toast('Auto-review complete');render()})}return}
  const live=allPatients().find(r=>r.live&&r.status==='new');
  if(live&&!(S.d.screen==='detail'&&S.d.sel===live.id))return G(2400,()=>openRec(live.id));
  const cur=S.d.screen==='detail'&&findRec(S.d.sel);
  if(cur&&cur.live&&cur.status==='review')return G(6000,sendReply);
  if(cur&&cur.live&&cur.status==='replied'&&!cur.invite)return G(2500,()=>{S.d.meet=defaultMeet(cur);render()});
  return}
 if(!S.autopilot)return;const G=(ms,fn)=>go2(ms,()=>{if(S.autopilot)fn()});
 const p=S.p,qDelay=q=>S.voiceOn?Math.max(1900,Math.min(5000,tx(q.t).length*65)):1300;
 if(p.modal==='urgent')return G(3500,()=>{p.modal=null;render()});
 if(p.modal==='login'){const L=p.login;return G(1500,()=>{if(L.step==='phone'){const e=document.getElementById('l_phone');if(e)e.value=PERSONA.phone}else if(L.step==='otp'){const e=document.getElementById('l_otp');if(e)e.value=L.code}else{const i=LI[S.lang],a=document.getElementById('l_name'),b=document.getElementById('l_village');if(a)a.value=PERSONA.name[i];if(b)b.value=PERSONA.village[i]}setTimeout(()=>{if(S.autopilot&&p.modal==='login')loginNext()},900*S.speed)})}
 if((p.reply||p.invite)&&p.screen!=='messages'&&p.status!=='sent')return G(2800,()=>{p.unread=false;go('messages')});
 switch(p.screen){
  case'home':G(2000,()=>{if(S.lang!=='kn'){S.lang='kn';log('Language set to Kannada','voice')}startMode('full')});break;
  case'consent':G(3600,agreeNow);break;
  case'interview':{if(p.listening||p.pick)break;const q=nextQ();if(!q)break;
   if((q.type==='multi'||q.type==='scene')&&p.multiSel&&p.heard&&p.heard.q===q.id){G(1200,confirmMulti);break}
   G(qDelay(q),startListen);break}
  case'testsIntro':G(2400,nextTest);break;
  case'test':autoTest(G);break;
  case'testsDone':G(1800,finalize);break;
  case'result':if(!p.status)G(5000,openSend);else if(p.status==='sent'&&!S._hinted){S._hinted=1;toast('Open the optometrist portal (Demo controls) to review this report')}break;
  case'messages':if(p.reply&&!p.autoPlayed){p.autoPlayed=true;p.unread=false;G(900,playReply);if(p.invite)G(12000,()=>{S.autopilot=false;toast('Guided demo complete');render()})}else if(p.invite&&p.autoPlayed)G(4000,()=>{S.autopilot=false;toast('Guided demo complete');render()});break}}
function autoTest(G){const p=S.p,s=p.ts,id=p.cur,wrong=d=>Object.keys(DIRS).find(x=>x!==d);
 switch(id){case'setup':if(s.phase==='card')G(1800,setupNext);break;
  case'va':G(1200,()=>vaAns(s.level<=PERSONA.va[s.eye]?s.dir:wrong(s.dir)));break;
  case'contrast':G(1100,()=>cAns(s.level<=PERSONA.contrast?s.dir:wrong(s.dir)));break;
  case'near':G(1600,()=>nearAns(s.level<=PERSONA.near?'yes':'no'));break;
  case'np':if(s.phase==='ready')G(1400,npStart);else if(s.phase==='done')G(1800,npDone);break;
  case'color':G(1700,()=>colorAns(String(PLATES[s.i].n)));break;
  case'amsler':G(2000,()=>amslerDone('clear'));break;case'astig':G(2200,astigSame);break;
  case'pd':if(s.phase==='ready')G(1500,pdMeasure);else if(s.phase==='done')G(2000,pdDone);break}}

/* ============ test actions ============ */
function vaAns(v){const s=S.p.ts;if(v===s.dir){s.trial++;if(s.trial>=2){s.best=s.level;s.level++;s.trial=0;if(s.level>=VA.length)return finishEye()}s.dir=randDir(s.dir);render()}else finishEye()}
function finishEye(){const s=S.p.ts;S.p.vaTmp=S.p.vaTmp||{};S.p.vaTmp[s.eye]=s.best;log('Acuity '+(s.eye==='R'?'right':'left')+' eye: '+vaStr(s.best));
 if(s.eye==='R'){S.p.ts={eye:'L',level:0,trial:0,dir:randDir(),best:-1};render()}else{const r={R:S.p.vaTmp.R,L:s.best};S.p.vaTmp=null;doneTest('va',r,'R '+vaStr(r.R)+', L '+vaStr(r.L))}}
function cAns(v){const s=S.p.ts;if(v===s.dir){s.trial++;if(s.trial>=2){s.best=s.level;s.level++;s.trial=0;if(s.level>=CONTRAST.length)return cDone()}s.dir=randDir(s.dir);render()}else cDone()}
function cDone(){const s=S.p.ts,pct=s.best<0?100:CONTRAST[s.best];doneTest('contrast',{pct},'lowest contrast '+pct+'%')}
function nearAns(v){const s=S.p.ts;if(v==='yes'){if(s.level>=NEAR.length-1)return doneTest('near',{level:s.level},'reads '+NEAR[s.level]);s.level++;render()}else doneTest('near',{level:s.level-1},s.level?'smallest read '+NEAR[s.level-1]:'could not read N24')}
function npStart(){const s=S.p.ts;s.phase='moving';s.cm=60;render();clearInterval(S.iv);
 S.iv=setInterval(()=>{if(S.p.screen!=='test'||S.p.cur!=='np'||s.phase!=='moving'){clearInterval(S.iv);return}s.cm-=0.5;const el=document.getElementById('npv'),bar=document.getElementById('npbar');if(el)el.textContent=Math.round(s.cm)+' cm';if(bar)bar.style.width=Math.max(0,(s.cm-8)/52*100)+'%';if((S.autopilot&&s.cm<=PERSONA.np)||s.cm<=8)npBlur()},90*S.speed)}
function npBlur(){const s=S.p.ts;if(s.phase!=='moving')return;clearInterval(S.iv);s.phase='done';const amp=100/s.cm;s.add=Math.max(0,Math.min(3,Math.round((2.5-amp/2)*4)/4));log('Near point '+Math.round(s.cm)+' cm: reading add ≈ +'+s.add.toFixed(2),'rule');render()}
function npDone(){const s=S.p.ts;doneTest('np',{cm:Math.round(s.cm),add:s.add},'near point '+Math.round(s.cm)+' cm')}
function colorAns(v){const s=S.p.ts;if(String(PLATES[s.i].n)===v)s.c++;s.i++;if(s.i>=PLATES.length)return doneTest('color',{c:s.c,n:PLATES.length},s.c+' of '+PLATES.length);render()}
function amslerDone(v){const s=S.p.ts,n=v==='clear'?0:s.marks.length;if(s.eye==='R'){S.p.ts={eye:'L',marks:[],R:n};render()}else doneTest('amsler',{R:s.R,L:n},'R '+s.R+', L '+n)}
function astigSame(){doneTest('astig',{res:'none'},'no line darker')}
function astigLine(k){k=+k;doneTest('astig',{res:'possible',clock:k,axis:k*30},'axis ≈ '+k*30+'°')}
function pdMeasure(){const s=S.p.ts;s.phase='measuring';render();setTimeout(()=>{if(S.p.cur!=='pd')return;s.phase='done';s.pd=S.autopilot?PERSONA.pd:Math.round((58+Math.random()*9)*2)/2;s.conf=88;log('Pupil distance '+s.pd.toFixed(1)+' mm','rule');render()},2400*S.speed)}
function pdDone(){const s=S.p.ts;doneTest('pd',{pd:s.pd,conf:s.conf},s.pd.toFixed(1)+' mm')}
function setupNext(){const s=S.p.ts;S.p._px=s.w/85.6;s.phase='dist';s.dist=72;s.ok=false;render();clearInterval(S.iv);
 S.iv=setInterval(()=>{if(S.p.cur!=='setup'||s.phase!=='dist'){clearInterval(S.iv);return}s.dist=Math.max(40,s.dist-1);const el=document.getElementById('distv');if(el)el.textContent=s.dist+' cm';
  if(s.dist<=41&&!s.ok){s.ok=true;clearInterval(S.iv);const ok=document.getElementById('distok');if(ok)ok.innerHTML=`<span class="ok">${ic('check','s')} ${t('distOk')}</span>`;const b=document.getElementById('setupDone');if(b)b.disabled=false;
   if(S.autopilot){const tok=S.tok;setTimeout(()=>{if(tok===S.tok&&S.autopilot)setupDone()},1300*S.speed)}}},70*S.speed)}
function setupDone(){const px=S.p._px||3.78;doneTest('setup',{pxmm:px},px.toFixed(2)+' px/mm, 40 cm')}

/* ============ actions ============ */
function agreeNow(){S.p.consented=true;log('Consent given by voice/tap');afterConsent()}
function setHours(v){S.p.val=v;const h=document.getElementById('hv');if(h)h.textContent=v;const q=nextQ();const icn=q&&q.id==='phone'?'mobile':q&&q.id==='outdoor'?'sun':'book';const s=document.getElementById('suns');if(s)[...s.children].forEach((c,i)=>{c.classList.toggle('on',i<v);c.innerHTML=i<v?`<svg viewBox="0 0 24 24">${ICO[icn]}</svg>`:''});const r=document.getElementById('hrange')||document.getElementById('arange');if(r&&+r.value!==v)r.value=v}
const ACT={
 home:()=>{stopSpeak();clearInterval(S.iv);S.p.listening=false;go('home')},
 mode:v=>startMode(v),
 setLang:v=>{S.lang=v;document.documentElement.lang=v;S._spoken=null;log('Language: '+LANGS[v].name,'voice');render()},
 voice:()=>{S.voiceOn=!S.voiceOn;if(!S.voiceOn)stopSpeak();else S._spoken=null;render()},
 dock:()=>{S.dockOpen=!S.dockOpen;render()},
 auto:()=>{S.autopilot=!S.autopilot;log(S.autopilot?'Guided demo started: Ramappa, 55, farmer from Hosahalli, speaks Kannada':'Guided demo stopped');render()},
 docAuto:()=>{S.docAuto=!S.docAuto;log(S.docAuto?'Auto-review on':'Auto-review off');render()},
 net:()=>toggleNet(),
 portal:()=>{location.hash=S.page==='portal'?'':'optometrist'},
 reset:()=>{stopSpeak();clearInterval(S.iv);saveShared({subs:{}});Object.assign(S,{p:freshP(),seeds:seedPatients(),log:[],lang:'en',online:true,autopilot:false,docAuto:false,_spoken:null,_hinted:0});S.d=Object.assign(S.d,{tab:'queue',screen:'queue',sel:null,filter:'all',q:'',meet:null});lastSig='';render()},
 agree:()=>agreeNow(),
 replay:()=>{S._spoken=null;speakForScreen()},
 opt:v=>{const q=nextQ();if(!q||S.p.pick)return;if(q.type==='single'){S.p.pick=v;render();setTimeout(()=>setAnswer(q.id,v),380);return}
  let sel=(S.p.multiSel||[]).slice();if(v===q.excl)sel=sel.includes(v)?[]:[v];else{sel=sel.filter(x=>x!==q.excl);sel=sel.includes(v)?sel.filter(x=>x!==v):[...sel,v]}S.p.multiSel=sel;render()},
 sitem:v=>{let sel=(S.p.multiSel||[]).slice();sel=sel.includes(v)?sel.filter(x=>x!==v):[...sel,v];S.p.multiSel=sel;render()},
 sceneClear:()=>{const q=nextQ();if(q)setAnswer(q.id,[])},
 qnext:()=>{const q=nextQ();if(!q)return;if(q.type==='hours'||q.type==='age')return setAnswer(q.id,S.p.val==null?initVal(q):S.p.val);confirmMulti()},
 hset:v=>setHours(+v),
 aset:v=>setHours(Math.max(5,Math.min(95,(S.p.val==null?40:S.p.val)+ +v))),
 aval:v=>setHours(+v),
 qback:()=>{const id=S.p.qhist.pop();if(id){const prev=S.p.answers[id];delete S.p.answers[id];S.p.multiSel=Array.isArray(prev)?prev.slice():null;S.p.val=typeof prev==='number'?prev:null;delete S.p.voiceAns[id];prune();S.p.ackAt=0}render()},
 mic:()=>startListen(),
 micDir:act=>{const opts=['up','down','left','right'].map(v=>({v,l:T[v],kw:[v,{up:'upar',down:'neeche',left:'baayen',right:'daayen'}[v]]}));
  if(!recognize(alts=>{if(!alts){toast(t('notUnderstood'));return}const m=matchOpts(alts,opts);if(m.length)(act==='vaAns'?vaAns:cAns)(m[0]);else toast(t('notUnderstood'))}))toast(t('voiceFail'))},
 urgentClose:()=>{S.p.modal=null;stopSpeak();if(!nextQ())finishInterview();else render()},
 callHosp:()=>toast(t('calling')),
 startTests:()=>nextTest(),openTest:v=>openTest(v),
 vaAns:v=>vaAns(v),cAns:v=>cAns(v),nearAns:v=>nearAns(v),npStart:()=>npStart(),npBlur:()=>npBlur(),npDone:()=>npDone(),colorAns:v=>colorAns(v),
 amslerCell:v=>{const s=S.p.ts;v=+v;s.marks=s.marks.includes(v)?s.marks.filter(x=>x!==v):[...s.marks,v];const b=document.querySelector(`[data-act="amslerCell"][data-v="${v}"]`);if(b)b.setAttribute('aria-pressed',s.marks.includes(v));const d=document.querySelector('[data-act="amslerDone"][data-v="marked"]');if(d)d.disabled=!s.marks.length},
 amslerDone:v=>amslerDone(v),astigSame:()=>astigSame(),astigLine:v=>astigLine(v),pdMeasure:()=>pdMeasure(),pdDone:()=>pdDone(),setupNext:()=>setupNext(),setupDone:()=>setupDone(),
 finalize:()=>finalize(),
 listenProfile:()=>{const r=S.p.result;if(r)speak((r.dominant?t('mostly',{z:t('za_'+r.dominant)})+' ':'')+t('triD_'+r.tri)+' '+r.tips.slice(0,2).map(k=>tx(TIPS[k][1])).join(' '))},
 share:()=>toast(t('shared')),
 send:()=>openSend(),loginNext:()=>loginNext(),loginCancel:()=>{S.p.modal=null;S.p.login=null;render()},
 report:()=>go('result'),
 msgs:()=>{S.p.unread=false;go('messages')},
 playReply:()=>playReply(),directions:()=>toast(t('dirToast')),
 docLogin:()=>{S.d.logged=true;log('Optometrist signed in');render()},
 docLogout:()=>{S.d.logged=false;render()},
 dtab:v=>{S.d.tab=v;if(v==='queue')S.d.screen='queue';render()},
 dopen:v=>openRec(v),dback:()=>{S.d.screen='queue';render()},dfilter:v=>{S.d.filter=v;render()},
 dsend:()=>sendReply(),
 dreopen:()=>{updateRec(S.d.sel,x=>{x.reply=null;x.status='review'});lastSig='';render()},
 dmeet:()=>{const r=findRec(S.d.sel);if(r){S.d.meet=defaultMeet(r);render()}},
 gcalOpened:(v,el,e)=>{log('Google Calendar invite opened for '+(findRec(S.d.meet.id)||{}).name,'net');return 'native'},
 meetClose:()=>{S.d.meet=null;render()},
 meetSend:()=>sendInvite(),
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(!f)return;
 if(el.tagName==='A'){f(el.dataset.v,el,e);return}e.preventDefault();f(el.dataset.v,el,e)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-act]')){e.preventDefault();ACT.dopen(e.target.dataset.v)}
 if(e.key==='Enter'&&S.p.modal==='login'&&e.target.id&&e.target.id.startsWith('l_')){e.preventDefault();loginNext()}});
document.addEventListener('input',e=>{const el=e.target;
 if(el.id==='hrange'||el.id==='arange')setHours(+el.value);
 if(el.id==='cardw'){S.p.ts.w=+el.value;const b=document.getElementById('cardbox');if(b)b.style.width=el.value+'px';const p=document.getElementById('pxmm');if(p)p.textContent='1 mm = '+(el.value/85.6).toFixed(2)+' px'}
 if(el.id==='l_phone'&&S.p.login)S.p.login.phone=el.value;if(el.id==='l_otp'&&S.p.login){S.p.login.otp=el.value;if(el.value.length===4)setTimeout(loginNext,200)}
 if(el.id==='l_name'&&S.p.login)S.p.login.name=el.value;if(el.id==='l_village'&&S.p.login)S.p.login.village=el.value;
 if(el.id==='dsearch'){S.d.q=el.value;const q=el.value.toLowerCase();document.querySelectorAll('tr.rw').forEach(r=>{r.style.display=r.dataset.s.includes(q)?'':'none'})}
 if(el.id==='r_notes'){const r=findRec(S.d.sel);if(r)r._draftNotes=el.value}
 if(el.id&&el.id.startsWith('r_'))updPreview();if(el.id&&el.id.startsWith('m_'))updMeet()});
document.addEventListener('change',e=>{const el=e.target;if((el.id&&el.id.startsWith('r_'))||el.name==='r_coat')updPreview();if(el.id&&el.id.startsWith('m_'))updMeet()});
function updPreview(){const r=findRec(S.d.sel),f=readForm(),el=document.getElementById('r_prevtxt');if(r&&f&&el)el.textContent=replyText(r.name,f,r.lang)}
render();
</script>
